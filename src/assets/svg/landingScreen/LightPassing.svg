<stop stop-color="#ffffff" stop-opacity="0.4"/>
<stop offset="0.2" stop-color="#f8fafc" stop-opacity="0.35"/>
<stop offset="0.5" stop-color="#e2e8f0" stop-opacity="0.3"/>
<stop offset="0.8" stop-color="#cbd5e1" stop-opacity="0.25"/>
<stop offset="1" stop-color="#94a3b8" stop-opacity="0.2"/>
</linearGradient>


<!-- Glow filter -->
<filter id="glow" x="-300%" y="-300%" width="700%" height="700%">
  <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
  <feMerge> 
    <feMergeNode in="coloredBlur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<!-- Intense glow filter -->
<filter id="glowIntense" x="-400%" y="-400%" width="900%" height="900%">
  <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
  <feMerge> 
    <feMergeNode in="coloredBlur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<!-- White glow filter -->
<filter id="whiteGlow" x="-500%" y="-500%" width="1100%" height="1100%">
  <feGaussianBlur stdDeviation="18" result="whiteBlur"/>
  <feMerge> 
    <feMergeNode in="whiteBlur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<!-- White glow outer filter -->
<filter id="whiteGlowOuter" x="-600%" y="-600%" width="1300%" height="1300%">
  <feGaussianBlur stdDeviation="25" result="whiteOuterBlur"/>
  <feMerge> 
    <feMergeNode in="whiteOuterBlur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>
</defs>
