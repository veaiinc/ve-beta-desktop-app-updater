  stroke="url(#whiteGlowGradient)" 
  stroke-width="4"
  stroke-linecap="round"
  filter="url(#whiteGlowOuter)"
/>

<defs>
<!-- Original gradient -->
<linearGradient id="paint0_linear_1133_181" x1="133.5" y1="116" x2="133.5" y2="3470" gradientUnits="userSpaceOnUse">
<stop stop-color="white" stop-opacity="0.2"/>
<stop offset="0.5" stop-color="white"/>
<stop offset="1" stop-color="white" stop-opacity="0.2"/>
</linearGradient>

<!-- Glow gradient -->
<linearGradient id="glowGradient" x1="133.5" y1="0" x2="133.5" y2="3527" gradientUnits="userSpaceOnUse">
<stop stop-color="#60a5fa" stop-opacity="0.6"/>
<stop offset="0.3" stop-color="#3b82f6" stop-opacity="0.8"/>
<stop offset="0.7" stop-color="#1e40af" stop-opacity="0.7"/>
<stop offset="1" stop-color="#1e3a8a" stop-opacity="0.5"/>
</linearGradient>

<!-- Intense glow gradient -->
<linearGradient id="glowGradientIntense" x1="133.5" y1="0" x2="133.5" y2="3527" gradientUnits="userSpaceOnUse">
<stop stop-color="#dbeafe" stop-opacity="0.7"/>
<stop offset="0.3" stop-color="#93c5fd" stop-opacity="0.9"/>
<stop offset="0.7" stop-color="#60a5fa" stop-opacity="0.8"/>
<stop offset="1" stop-color="#3b82f6" stop-opacity="0.6"/>
</linearGradient>

<!-- White glow gradient -->
