name: Test Build (No Release)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - mac
          - win
          - linux

jobs:
  test-build:
    runs-on: ${{ github.event.inputs.platform == 'win' && 'windows-latest' || github.event.inputs.platform == 'linux' && 'ubuntu-latest' || 'macos-latest' }}
    permissions:
      contents: read
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build NotchDrop Native Module
        if: ${{ github.event.inputs.platform == 'all' || github.event.inputs.platform == 'mac' }}
        run: npm run build:notchdrop:all

      - name: Clean Build Environment
        run: npm run clean:build:cross

      - name: Build Application
        run: |
          if [ "${{ github.event.inputs.platform }}" = "win" ]; then
            npm run build:win
          else
            npm run build
          fi

      - name: Rebuild Native Modules
        if: ${{ github.event.inputs.platform == 'all' || github.event.inputs.platform == 'mac' }}
        run: npm run rebuild:native:mac

      - name: Package Application
        run: |
          case "${{ github.event.inputs.platform }}" in
            "mac")
              npm run package:mac
              ;;
            "win")
              npm run package:win
              ;;
            "linux")
              npm run package:linux
              ;;
            "all")
              npm run package:all
              ;;
          esac

      - name: Verify Build Artifacts
        run: |
          echo "Build artifacts in dist/:"
          ls -la dist/ || echo "No dist/ directory found"
          echo ""
          echo "Build artifacts in build/:"
          ls -la build/ || echo "No build/ directory found"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ github.event.inputs.platform }}-${{ github.run_number }}
          path: |
            dist/
            build/
          retention-days: 7

      - name: Build Summary
        run: |
          echo "✅ Test build completed successfully!"
          echo "Platform: ${{ github.event.inputs.platform }}"
          echo "Runner: ${{ runner.os }}"
          echo "Node.js: $(node --version)"
          echo "Build artifacts uploaded for download"
