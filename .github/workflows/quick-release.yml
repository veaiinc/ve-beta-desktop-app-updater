name: Quick Release (Patch Version)

on:
  workflow_dispatch:
    inputs:
      skip_notarization:
        description: 'Skip notarization (for testing)'
        required: false
        default: false
        type: boolean

jobs:
  quick-release:
    runs-on: macos-latest
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Install Dependencies
        run: npm ci

      - name: Build NotchDrop Native Module
        run: npm run build:notchdrop:all

      - name: Auto-increment Patch Version
        id: version
        run: |
          # Get current version
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"
          
          # Increment patch version
          NEW_VERSION=$(npm version patch --no-git-tag-version)
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"
          
          # Commit and tag
          git add package.json package-lock.json
          git commit -m "chore(release): bump version to $NEW_VERSION"
          git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"
          git push origin main
          git push origin "v$NEW_VERSION"
          
          # Also push to releases remote
          git push releases main
          git push releases "v$NEW_VERSION"

      - name: Build and Package
        run: |
          npm run clean:build:cross
          npm run build
          npm run rebuild:native:mac
          npm run package:all

      - name: Notarize (if enabled)
        if: ${{ !github.event.inputs.skip_notarization }}
        run: |
          # Setup notarization
          if ! xcrun notarytool history --keychain-profile veai-profile-2 >/dev/null 2>&1; then
            xcrun notarytool store-credentials \
              --apple-id "${{ secrets.APPLE_ID }}" \
              --team-id "${{ secrets.APPLE_TEAM_ID }}" \
              --password "${{ secrets.APPLE_APP_PASSWORD }}" \
              veai-profile-2
          fi
          
          # Notarize and staple
          xcrun notarytool submit dist/Ve.AI-x64-mac.dmg --keychain-profile veai-profile-2 --wait
          xcrun notarytool submit dist/Ve.AI-arm64-mac.dmg --keychain-profile veai-profile-2 --wait
          xcrun stapler staple dist/Ve.AI-x64-mac.dmg
          xcrun stapler staple dist/Ve.AI-arm64-mac.dmg

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          name: Ve.AI v${{ steps.version.outputs.new_version }}
          files: |
            dist/Ve.AI-*.dmg
            dist/Ve.AI-*.exe
            dist/Ve.AI-*.AppImage
          generate_release_notes: true
          repository: veaiinc/ve-desktop-app-updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Success Notification
        run: |
          echo "🚀 Quick release v${{ steps.version.outputs.new_version }} completed!"
          echo "🔗 https://github.com/veaiinc/ve-desktop-app-updater/releases/tag/v${{ steps.version.outputs.new_version }}"
