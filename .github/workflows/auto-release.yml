name: Automated Release Pipeline

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version increment type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      skip_notarization:
        description: 'Skip notarization (for testing)'
        required: false
        default: false
        type: boolean

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Install Dependencies
        run: npm ci

      - name: Build NotchDrop Native Module
        run: npm run build:notchdrop:all

      - name: Get Current Version
        id: current_version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"

      - name: Increment Version
        id: version
        run: |
          VERSION_TYPE="${{ github.event.inputs.version_type || 'patch' }}"
          echo "Incrementing $VERSION_TYPE version..."
          
          # Increment version and create tag
          NEW_VERSION=$(npm version $VERSION_TYPE --no-git-tag-version)
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"
          
          # Commit version change
          git add package.json package-lock.json
          git commit -m "chore(release): bump version to $NEW_VERSION"
          
          # Create and push tag
          git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"
          git push origin main
          git push origin "v$NEW_VERSION"
          
          # Also push to releases remote
          git push releases main
          git push releases "v$NEW_VERSION"

      - name: Clean Build Environment
        run: npm run clean:build:cross

      - name: Build Application
        run: npm run build

      - name: Rebuild Native Modules for macOS
        run: npm run rebuild:native:mac

      - name: Package for macOS and Windows
        run: npm run package:all

      - name: Verify Build Artifacts
        run: |
          echo "Build artifacts:"
          ls -la dist/
          echo ""
          echo "Checking for required files:"
          if [ -f "dist/Ve.AI-x64-mac.dmg" ]; then
            echo "✅ Intel DMG found"
          else
            echo "❌ Intel DMG missing"
            exit 1
          fi
          if [ -f "dist/Ve.AI-arm64-mac.dmg" ]; then
            echo "✅ Apple Silicon DMG found"
          else
            echo "❌ Apple Silicon DMG missing"
            exit 1
          fi
          if [ -f "dist/Ve.AI-x64-win.exe" ] || [ -f "dist/Ve.AI-x64-win.nsis.exe" ]; then
            echo "✅ Windows installer found"
          else
            echo "❌ Windows installer missing"
            exit 1
          fi

      - name: Setup Notarization (macOS only)
        if: ${{ !github.event.inputs.skip_notarization }}
        run: |
          echo "Setting up notarization environment..."
          # Create keychain profile if it doesn't exist
          if ! xcrun notarytool history --keychain-profile veai-profile-2 >/dev/null 2>&1; then
            echo "Creating keychain profile..."
            xcrun notarytool store-credentials \
              --apple-id "${{ secrets.APPLE_ID }}" \
              --team-id "${{ secrets.APPLE_TEAM_ID }}" \
              --password "${{ secrets.APPLE_APP_PASSWORD }}" \
              veai-profile-2
          else
            echo "Keychain profile already exists"
          fi

      - name: Notarize macOS Applications
        if: ${{ !github.event.inputs.skip_notarization }}
        run: |
          echo "Starting notarization process..."
          
          # Notarize Intel (x64) DMG
          echo "Notarizing Intel (x64) DMG..."
          xcrun notarytool submit dist/Ve.AI-x64-mac.dmg \
            --keychain-profile veai-profile-2 \
            --wait
          
          # Notarize Apple Silicon (arm64) DMG
          echo "Notarizing Apple Silicon (arm64) DMG..."
          xcrun notarytool submit dist/Ve.AI-arm64-mac.dmg \
            --keychain-profile veai-profile-2 \
            --wait
          
          echo "Notarization complete. Stapling DMG files..."
          
          # Staple both DMG files
          xcrun stapler staple dist/Ve.AI-x64-mac.dmg
          xcrun stapler staple dist/Ve.AI-arm64-mac.dmg
          
          echo "Stapling complete. DMG files are ready for distribution."

      - name: Generate Release Notes
        id: release_notes
        run: |
          # Get commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --oneline --no-merges)
          else
            COMMITS=$(git log --oneline --no-merges $LAST_TAG..HEAD)
          fi
          
          # Generate release notes
          cat > release_notes.md << EOF
          ## What's New in v${{ steps.version.outputs.new_version }}
          
          ### Changes
          $(echo "$COMMITS" | sed 's/^/- /')
          
          ### Downloads
          - **macOS (Intel)**: Ve.AI-x64-mac.dmg
          - **macOS (Apple Silicon)**: Ve.AI-arm64-mac.dmg  
          - **Windows**: Ve.AI-x64-win.exe
          
          ### Installation
          1. Download the appropriate file for your platform
          2. Run the installer
          3. Follow the setup wizard
          
          ---
          *This release was automatically generated by GitHub Actions*
          EOF
          
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          name: Ve.AI v${{ steps.version.outputs.new_version }}
          body: ${{ steps.release_notes.outputs.release_notes }}
          files: |
            dist/Ve.AI-*.dmg
            dist/Ve.AI-*.exe
            dist/Ve.AI-*.AppImage
          draft: false
          prerelease: false
          generate_release_notes: true
          repository: veaiinc/ve-desktop-app-updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Release with Build Info
        run: |
          # Get release ID from the releases repository
          RELEASE_ID=$(gh api repos/veaiinc/ve-desktop-app-updater/releases/tags/v${{ steps.version.outputs.new_version }} --jq '.id')
          
          # Add build information as a comment
          BUILD_INFO="
          ## Build Information
          - **Build Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          - **Commit**: ${{ github.sha }}
          - **Workflow**: ${{ github.workflow }}
          - **Runner**: ${{ runner.os }}
          - **Node.js**: $(node --version)
          - **Notarization**: ${{ github.event.inputs.skip_notarization == 'true' && 'Skipped' || 'Completed' }}
          "
          
          # Update release body
          CURRENT_BODY=$(gh api repos/veaiinc/ve-desktop-app-updater/releases/$RELEASE_ID --jq '.body')
          NEW_BODY="$CURRENT_BODY$BUILD_INFO"
          
          gh api repos/veaiinc/ve-desktop-app-updater/releases/$RELEASE_ID \
            --method PATCH \
            --field body="$NEW_BODY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Success
        run: |
          echo "🎉 Release v${{ steps.version.outputs.new_version }} created successfully!"
          echo "📦 Artifacts uploaded to GitHub Releases"
          echo "🔗 View release: https://github.com/veaiinc/ve-desktop-app-updater/releases/tag/v${{ steps.version.outputs.new_version }}"
