		<!-- Simplified Glass Mode System -->
		<script>
			// Simple glass mode initialization - CSS handles the rest
			function initializeGlassMode() {
				// Ensure main elements are transparent when glass mode is enabled
				const ensureTransparency = () => {
					const isGlassModeEnabled =
						localStorage.getItem('glassModeEnabled') === 'true' ||
						document.documentElement.classList.contains('glass-mode-enabled');

					if (isGlassModeEnabled) {
						const mainElements = ['html', 'body', '#root'];
						mainElements.forEach((selector) => {
							const element = document.querySelector(selector);
							if (element) {
								element.style.background = 'transparent';
								element.style.backgroundColor = 'transparent';
							}
						});
					}
				};

				// Apply transparency on load
				ensureTransparency();

				// Monitor for glass mode class changes
				const observer = new MutationObserver(() => {
					ensureTransparency();
				});

				observer.observe(document.documentElement, {
					attributes: true,
					attributeFilter: ['class'],
				});
				console.log('Simplified glass mode system initialized');
			}

			// Initialize when DOM is ready
			document.addEventListener('DOMContentLoaded', initializeGlassMode);
		</script>
